name: academic-support

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=128M
      - --innodb-log-buffer-size=16M
      - --max-connections=60
      - --performance-schema=OFF
    environment:
      MYSQL_DATABASE: academic_support
      MYSQL_USER: academic_support
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    mem_limit: 420m
    cpus: 0.75
    networks:
      - academic-support-internal

  backend:
    image: eclipse-temurin:21-jre-alpine
    restart: unless-stopped
    env_file:
      - ${STORAGE_ENV_FILE:-/home/ubuntu/.config/academic-support/storage.env}
    working_dir: /app
    command:
      - java
      - -Xms96m
      - -Xmx384m
      - -XX:MaxMetaspaceSize=160m
      - -XX:+UseSerialGC
      - -jar
      - /app/app.jar
    environment:
      DB_URL: jdbc:mysql://mysql:3306/academic_support?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: academic_support
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MATCHING_ENCRYPTION_KEY: ${MATCHING_ENCRYPTION_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-cos}
      STORAGE_DIRECT_UPLOAD: ${STORAGE_DIRECT_UPLOAD:-false}
      STORAGE_DIRECT_READ: ${STORAGE_DIRECT_READ:-false}
      PRIVATE_FILE_ROOT: /app/data/private
      SERVER_PORT: 8080
      TZ: Asia/Shanghai
    volumes:
      - ./app/app.jar:/app/app.jar:ro
      - ./data/private:/app/data/private
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 520m
    cpus: 1.25
    networks:
      - academic-support-internal

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    mem_limit: 32m
    cpus: 0.25
    networks:
      academic-support-internal:
        aliases:
          - academic-support-web

networks:
  academic-support-internal:
    name: academic-support-internal

volumes:
  mysql-data:
    name: academic-support-mysql-data
