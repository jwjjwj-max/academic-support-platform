<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="“1+1≥3”学业精准帮扶智慧平台可交互原型" />
    <title>学业帮扶智慧平台 · 功能原型</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark">1+1</div>
          <div>
            <strong>学业帮扶平台</strong>
            <span>功能交互原型</span>
          </div>
        </div>

        <div class="demo-panel">
          <span class="demo-badge">本地演示数据</span>
          <label for="role-switcher">演示角色</label>
          <select id="role-switcher">
            <option value="climber">学业攀登者 · 陈晨</option>
            <option value="navigator">学业领航者 · 林晓</option>
            <option value="admin">管理员 · 学习部</option>
          </select>
          <label for="period-switcher">活动期次</label>
          <select id="period-switcher"></select>
        </div>

        <nav id="primary-nav" aria-label="主导航"></nav>

        <div class="sidebar-footer">
          <button type="button" class="button ghost full" data-action="reset-demo">重置演示数据</button>
          <small>保存于当前浏览器，不连接真实学校系统</small>
        </div>
      </aside>

      <div class="main-column">
        <header class="topbar">
          <button type="button" class="icon-button menu-button" data-action="toggle-sidebar" aria-label="展开菜单">☰</button>
          <div>
            <h1 id="page-title">首页</h1>
            <p id="page-subtitle">当前期次业务概览</p>
          </div>
          <div class="topbar-actions">
            <button type="button" class="icon-button notification-button" data-nav="notifications" aria-label="消息中心">
              🔔<span id="notification-count" class="count-badge">0</span>
            </button>
            <div class="user-chip" id="user-chip"></div>
          </div>
        </header>

        <main id="app" tabindex="-1"></main>
      </div>
    </div>

    <dialog id="modal" class="modal">
      <form method="dialog" id="modal-form">
        <div class="modal-header">
          <h2 id="modal-title">操作</h2>
          <button type="button" class="icon-button" data-action="close-modal" aria-label="关闭">×</button>
        </div>
        <div id="modal-body" class="modal-body"></div>
        <div class="modal-actions">
          <button type="button" class="button ghost" data-action="close-modal">取消</button>
          <button type="submit" class="button primary" id="modal-submit">确认</button>
        </div>
      </form>
    </dialog>

    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

    <script src="./app.js"></script>
  </body>
</html>
