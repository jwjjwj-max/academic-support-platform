spring:
  datasource:
    url: jdbc:h2:mem:academic_support;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:test-schema.sql

app:
  security:
    jwt-secret: integration-test-secret-key-at-least-thirty-two-bytes
    access-token-minutes: 120
  bootstrap:
    owner-login:
    owner-password:
  storage:
    private-root: ./target/test-private
    photo-max-bytes: 5242880
    grade-max-bytes: 20971520
    moral-max-bytes: 20971520
